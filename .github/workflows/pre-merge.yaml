name: Pre-merge checks

on:
  # Trigger on pull requests
  pull_request:
  # Optional: Manual trigger for on-demand linting
  workflow_dispatch:

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  detect-modules:
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set list of modules
        id: set-modules
        # The root module and the nested ones, such as scenario/.
        run: echo "modules=$(find "$PWD" -name go.mod -not -path '*/bin/*' -printf '%h\n' | sort | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
  
  golangci-lint:
    needs: detect-modules
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.modules }}/go.mod
      - name: golangci-lint ${{ matrix.modules }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.modules }}

  tests:
    runs-on: ubuntu-26.04
    needs: detect-modules
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.modules }}/go.mod
      - name: Run tests
        working-directory: ${{ matrix.modules }}
        run: go test -v ./...

  build-e2e:
    # The on-hardware integration harnesses are not run in CI (they need real
    # hardware), but they are built so a change to the adapters cannot silently
    # break them.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build e2e harnesses
        run: make build-e2e

  pre-merge:
    name: Pre Merge
    # Single check for rulesets to require: GitHub reports one check per job, never one per workflow
    # always(): a job skipped because a dependency failed reports success and would let the PR merge
    if: always()
    needs:
      - detect-modules
      - golangci-lint
      - tests
      - build-e2e
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if a pre-merge job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
