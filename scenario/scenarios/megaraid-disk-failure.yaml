name: MegaRAID disk failure and replacement
description: |
  A MegaRAID 9560-8i with HDDs in enclosure 251, each in its own RAID0
  volume, as ARTESCA deploys them. Drive 251:3 fails, is replaced, then gets a
  new volume (RD-2154, ARTESCA-17960).

  The capture is real storcli output of a lab node while all its drives
  were healthy, kept to its first 4 drives, with serials and WWNs replaced by
  fake ones. No storcli output was captured while a drive was failed: the
  changes below follow what that node showed when 251:3 failed (its volume
  reported offline, the drive reported Failed with its serial cut to 8
  characters, no by-id link for the offline volume).

  Each table lists, per drive, what must be reported: by raidmgmt (drives
  and the volume holding them) and by disk-management-agent (the
  DiscoveredPhysicalDisk status read by the Storage Service UI).

controller: megaraid
capture: megaraid9560-4hdd

phases:
  - name: healthy
    description: All drives online, each RAID0 volume optimal.
    expect: |
      slot    status  serial                devicePath  permanentPath
      251:1   Used    SIMD0001000000000000  /dev/sdl    /dev/disk/by-id/wwn-0x600062b2000000000000000000000239
      251:2   Used    SIMD0002000000000000  /dev/sdk    /dev/disk/by-id/wwn-0x600062b2000000000000000000000238
      251:3   Used    SIMD0003000000000000  /dev/sdj    /dev/disk/by-id/wwn-0x600062b2000000000000000000000237
      251:4   Used    SIMD0004000000000000  /dev/sdi    /dev/disk/by-id/wwn-0x600062b2000000000000000000000236

  - name: failed
    description: |
      251:3 fails. Its RAID0 volume goes offline and is no longer a block
      device. The other drives must keep their paths.
    changes:
      drives:
        "251:3": {state: Failed, serial: SIMD0003}
      volumes:
        "237": {state: OfLn, exposed: false}
    expect: |
      slot    status  serial                devicePath  permanentPath
      251:1   Used    SIMD0001000000000000  /dev/sdl    /dev/disk/by-id/wwn-0x600062b2000000000000000000000239
      251:2   Used    SIMD0002000000000000  /dev/sdk    /dev/disk/by-id/wwn-0x600062b2000000000000000000000238
      251:3   Failed  SIMD0003              -           -
      251:4   Used    SIMD0004000000000000  /dev/sdi    /dev/disk/by-id/wwn-0x600062b2000000000000000000000236

  - name: replaced
    description: |
      The offline volume is deleted and a new drive is inserted in 251:3,
      unconfigured. It must be reported as a new, available drive.
    changes:
      drives:
        "251:3": {state: UGood, serial: SIMD0013000000000000, wwn: 5000C50000000013, deviceID: 12, group: "-"}
      volumes:
        "237": {deleted: true}
    expect: |
      slot    status          serial                devicePath  permanentPath
      251:1   Used            SIMD0001000000000000  /dev/sdl    /dev/disk/by-id/wwn-0x600062b2000000000000000000000239
      251:2   Used            SIMD0002000000000000  /dev/sdk    /dev/disk/by-id/wwn-0x600062b2000000000000000000000238
      251:3   UnassignedGood  SIMD0013000000000000  -           -
      251:4   Used            SIMD0004000000000000  /dev/sdi    /dev/disk/by-id/wwn-0x600062b2000000000000000000000236

  - name: restored
    description: A new RAID0 volume is created on the new drive.
    changes:
      drives:
        "251:3": {state: Onln, group: "2"}
      volumes:
        "237": {deleted: false, state: Optl, exposed: true, device: /dev/sdm, wwn: 600062b2000000000000000000001237}
    expect: |
      slot    status  serial                devicePath  permanentPath
      251:1   Used    SIMD0001000000000000  /dev/sdl    /dev/disk/by-id/wwn-0x600062b2000000000000000000000239
      251:2   Used    SIMD0002000000000000  /dev/sdk    /dev/disk/by-id/wwn-0x600062b2000000000000000000000238
      251:3   Used    SIMD0013000000000000  /dev/sdm    /dev/disk/by-id/wwn-0x600062b2000000000000000000001237
      251:4   Used    SIMD0004000000000000  /dev/sdi    /dev/disk/by-id/wwn-0x600062b2000000000000000000000236
